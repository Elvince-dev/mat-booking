<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Ticket</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.ticket{
    width:100%;
    max-width:850px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    position:relative;
}

/* Main Section */
.ticket-main{
    flex:2;
    padding:35px;
}

.logo{
    color:#2563eb;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
}

.route{
    font-size:26px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:25px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.info-box{
    background:#f8fafc;
    padding:14px;
    border-radius:12px;
}

.label{
    font-size:12px;
    text-transform:uppercase;
    color:#64748b;
    letter-spacing:1px;
    margin-bottom:5px;
}

.value{
    font-size:16px;
    font-weight:600;
    color:#0f172a;
}

/* Ticket Stub */
.ticket-stub{
    flex:1;
    background:#2563eb;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    padding:30px;
}

/* Dotted separator */
.ticket-stub::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    height:100%;
    border-left:3px dashed rgba(255,255,255,.4);
}

.ticket-stub img{
    width:180px;
    max-width:100%;
    background:white;
    padding:10px;
    border-radius:12px;
    margin-bottom:20px;
}

.reference{
    font-size:13px;
    letter-spacing:2px;
    opacity:.9;
    text-align:center;
}

.ticket-badge{
    margin-top:15px;
    background:rgba(255,255,255,.15);
    padding:8px 18px;
    border-radius:30px;
    font-size:13px;
}

.home-btn{
    display:inline-block;
    margin-top:30px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.home-btn:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:25px;
}

/* Mobile */
@media(max-width:768px){

    .ticket{
        flex-direction:column;
    }

    .ticket-stub::before{
        left:0;
        top:0;
        width:100%;
        height:0;
        border-left:none;
        border-top:3px dashed rgba(255,255,255,.4);
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .route{
        font-size:22px;
    }

    .ticket-main{
        padding:25px;
    }

    .ticket-stub{
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="ticket">

    <div class="ticket-main">

        <div class="logo">
            ✈ Travel Ticket
        </div>

        <div class="route">
            {{ booking.route }}
        </div>

        <div class="info-grid">

            <div class="info-box">
                <div class="label">Passenger</div>
                <div class="value">{{ booking.passenger_name }}</div>
            </div>

            <div class="info-box">
                <div class="label">Seat Number</div>
                <div class="value">{{ booking.seat_number }}</div>
            </div>

            <div class="info-box">
                <div class="label">Booking Reference</div>
                <div class="value">{{ booking.reference }}</div>
            </div>

            <div class="info-box">
                <div class="label">Status</div>
                <div class="value">Confirmed</div>
            </div>

        </div>

        <div class="footer">
            <a href="/" class="home-btn">← Back Home</a>
        </div>

    </div>

    <div class="ticket-stub">

        {% if booking.qr_code %}
            <img src="{{ booking.qr_code.url }}" alt="QR Code">
        {% endif %}

        <div class="reference">
            REF: {{ booking.reference }}
        </div>

        <div class="ticket-badge">
            VALID TICKET
        </div>

    </div>

</div>

</body>
</html>
