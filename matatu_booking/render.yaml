services:
  - type: web
    name: njoroline-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn matatu_booking.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "your-app-name.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: njoroline-db
          property: connectionString

databases:
  - name: njoroline-db
    plan: free
    databaseName: njoroline
    user: njoroline
